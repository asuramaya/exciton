[package]
name = "exciton-claw"
version = "0.1.0"
edition = "2021"
description = "Claw — autonomous agent runtime for Exciton. Reads its own tape, proposes strategy tunes, narrates evolution events to the public diary."
license = "MIT"
repository = "https://github.com/asuramaya/exciton"

[[bin]]
name = "claw"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
async-trait = { workspace = true }
rmcp = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
toml = { workspace = true }
sha2 = "0.10"
getrandom = "0.4"
chacha20poly1305 = "0.10"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
