[workspace]
members = [".", "crates/claw"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
rmcp = { version = "0.17", features = ["client", "transport-streamable-http-client", "transport-child-process"] }
base64 = "0.22"
url = "2"
toml = "0.8"
# Filesystem permission helpers — used by claw's auth profile.
nix = { version = "0.31", features = ["fs"] }

[package]
name = "exciton"
version = "0.1.0"
edition = "2021"
description = "Exciton — MCP-first Solana intelligence engine. Deterministic on-chain scanner, signal forecaster, Telegram surface, and JSON publisher in one Rust binary."
license = "MIT"
repository = "https://github.com/asuramaya/exciton"
homepage = "https://github.com/asuramaya/exciton"
readme = "README.md"
keywords = ["solana", "mcp", "trading", "telegram", "signals"]
categories = ["command-line-utilities"]
authors = ["Exciton contributors"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
once_cell = "1"
rmcp = { version = "0.17", features = ["server", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
tower = "0.5"
schemars = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
solana-sdk = "2"
solana-client = "2"
solana-transaction-status = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "multipart"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
bs58 = "0.5"
base64 = "0.22"
bincode = "1"
# HMAC-SHA256 + hex encoding for the publisher's signed POST to the
# Cloudflare Worker (`/api/admin/publish`). The Worker validates the
# signature with the same scheme; without these we'd be re-implementing
# SHA-256 by hand.
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# plotters dropped 2026-05-02 PM — replaced by chromium-headless DexScreener
# screenshot via chart_screenshot.rs. The plotters sparkline rendered from
# our internal token_snapshots series only had 2 data points at call time,
# producing an unreadable straight line. The chromium screenshot captures
# the same chart traders see in DexScreener (real candles, volume, MCap).

# `image` crate for two post-processing steps in chart_screenshot.rs:
# (1) variance-check the chart-canvas region to detect mid-load
# screenshots (the "Loading pair…" grey box has near-zero variance vs
# loaded candles which are highly varied) and retry; (2) crop the bottom
# of the screenshot to remove the DexScreener watermark band + chin.
image = { version = "0.25", default-features = false, features = ["png"] }

# `headless_chrome` for chart_screenshot.rs CDP control. The
# `chromium --screenshot` CLI path exits as soon as the JS event loop
# drains, regardless of pending WebSocket data. With DexScreener's
# embed subscribing OHLCV via fire-and-forget WS callbacks, JS goes
# idle before data arrives — even --virtual-time-budget=50000 elapsed
# in 4s. CDP gives us proper wait-for-network-idle + wait-for-element
# semantics so the chart actually finishes loading before snapshot.
headless_chrome = "1.0"

[dev-dependencies]
tempfile = "3"
