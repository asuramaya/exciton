services:
  exciton:
    build:
      context: .
      dockerfile: Dockerfile
    image: exciton:latest
    container_name: exciton
    restart: unless-stopped
    env_file:
      - .env
    environment:
      EXCITON_DB_PATH: /data/exciton.db
    working_dir: /data
    volumes:
      - ${EXCITON_STATE_DIR:-./state}:/data
      - ${PUBLISHER_REPO_DIR:-./publisher-target}:/srv/publisher-target
      - ${EXCITON_SSH_DIR:-./ssh}:/root/.ssh
      - ${EXCITON_CONFIG_PATH:-./deploy/config.container.toml.example}:/etc/exciton/config.toml:ro
    stdin_open: true
    tty: true
