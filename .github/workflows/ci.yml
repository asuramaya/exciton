name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      # Lint gate. Tightened back to -D warnings after the post-v0.1.0
      # cleanup pass: 122 lib warnings → 0 (silenced via crate-level
      # allows in lib.rs / main.rs for the lint categories the
      # codebase intentionally favors). Examples are excluded — they
      # carry their own conventions and are not on the published
      # surface.
      - name: cargo clippy (lib + bins, deny warnings)
        run: cargo clippy --workspace --lib --bins -- -D warnings

      - name: cargo build --release (engine)
        run: cargo build --release --bin exciton

      - name: cargo build --release (agent)
        run: cargo build --release -p exciton-claw --bin claw

      - name: cargo build --release (examples)
        run: cargo build --release --examples

      - name: cargo test
        run: cargo test --release --tests --lib
