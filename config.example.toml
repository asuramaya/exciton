[rpc]
# Endpoints support ${ENV_VAR} syntax for API keys.
# Stack multiple providers for failover and combined rate limits.
# Keys are NEVER stored here — only env var references.
endpoints = [
    "https://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}",
    "https://solana-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}",
]

[wallet]
# Public key only — private key loaded from OS keychain at signing time
public_key = ""

[risk]
max_position_pct = 15.0
default_position_pct = 0.5
high_confidence_threshold = 80
slippage_bps = 100
priority_fee_lamports = 10000

[tracking]
# Wallet addresses to track for smart money signals
wallets = []
max_active_tokens = 500

[alerts]
confidence_threshold = 70
stale_feed_seconds = 30
